<!DOCTYPE html>
<!-- The Steam Workshop preview (1024 x 1024) - TEMPLATE. Rendered by: python tools\make_thumbnail.py, which cuts
     the PANEL_* images out of Anton's F12 screenshots (screenshots\originals, git-ignored) and writes
     tools\preview_thumbnail.jpg. Style: ..\better-skirmisher-separation's (gold frame, Palatino small caps).
     A real battle behind; the hold-ALT close-up (a spent enemy line beside your fresh shield wall) magnified;
     your Attack recovery + Athletics bars; the name and the hook below. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: #0d0a07; }
  .canvas {
    position: relative; width: 1024px; height: 1024px; background: #0d0a07;
    font-family: 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  }
  .battle {
    position: absolute; left: 0; top: 0; width: 1024px; height: 660px;
    background: url('PANEL_BATTLE') center 30% / cover no-repeat;
  }
  .shade {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 130% 95% at 50% 30%, rgba(0,0,0,0) 50%, rgba(13,10,7,0.4) 85%, rgba(13,10,7,0.8) 100%),
      linear-gradient(to bottom, rgba(13,10,7,0.92) 0%, rgba(13,10,7,0.55) 6%, rgba(0,0,0,0) 13%, rgba(0,0,0,0) 46%, rgba(13,10,7,0.75) 58%, rgba(13,10,7,1) 66%);
  }
  .frame {
    position: absolute; inset: 22px;
    border: 3px solid rgba(214, 178, 94, 0.85); border-radius: 26px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.35);
  }
  .card {
    position: absolute; left: 212px; top: 272px; width: 600px;
    border: 4px solid #e8c874; border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 22px 4px rgba(255, 205, 90, 0.45), 0 14px 34px rgba(0,0,0,0.85);
    background: #0d0a07;
  }
  .card .shot { width: 592px; height: 258px; background: url('PANEL_ALT') center / cover no-repeat; }
  .cap {
    position: absolute; left: 50%; top: 240px; transform: translateX(-50%); white-space: nowrap; z-index: 2;
    background: rgba(16, 12, 8, 0.94); border: 3px solid #e8c874; border-radius: 10px;
    padding: 4px 14px 7px; color: #f0e4c8; font-size: 30px; font-variant: small-caps; letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.9);
  }
  .cap b { color: #e8c874; }
  .bars {
    position: absolute; left: 212px; top: 548px; width: 600px; height: 74px;
    background: url('PANEL_BARS') center / cover no-repeat;
    border-radius: 10px; border: 2px solid rgba(214, 178, 94, 0.55);
    box-shadow: 0 10px 26px rgba(0,0,0,0.8);
  }
  .titleblock { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; }
  .trax {
    color: #d6b25e; font-size: 30px; letter-spacing: 20px; padding-left: 20px; font-variant: small-caps;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }
  h1 {
    color: #e8c874; font-weight: 600; font-variant: small-caps; line-height: 0.96; letter-spacing: 3px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.95), 0 0 45px rgba(232, 200, 116, 0.28);
  }
  h1 .a { display: block; font-size: 104px; }
  h1 .b { display: block; font-size: 80px; }
  .tagline {
    margin-top: 16px; color: #f0e4c8; font-size: 40px; font-style: italic;
    text-shadow: 0 2px 8px rgba(0,0,0,0.95);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="battle"></div>
    <div class="shade"></div>
    <div class="card"><div class="shot"></div></div>
    <div class="cap"><b>Hold ALT</b> · who is tired?</div>
    <div class="bars"></div>
    <div class="frame"></div>
    <div class="titleblock">
      <div class="trax">Trax</div>
      <h1><span class="a">Combat</span><span class="b">Enhancements</span></h1>
      <div class="tagline">Slower, tactical battles. Heroes matter.</div>
    </div>
  </div>
</body>
</html>
